<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>ChatDiWa</title>
    <style>
      body {
        margin: 0;
        background: transparent;
        font-family: sans-serif;
        color: #eee;
      }
      #log {
        padding: 8px;
        font-size: 14px;
      }
      #log div {
        opacity: 0.7;
      }
      #log div:last-child {
        opacity: 1;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div id="log"></div>
    <script>
      const log = document.getElementById("log");
      const queue = [];
      let playing = false;

      function playNext() {
        if (playing || queue.length === 0) return;
        playing = true;
        const item = queue.shift();
        const audio = new Audio(item.url);
        audio.onended = () => {
          playing = false;
          playNext();
        };
        audio.onerror = () => {
          playing = false;
          playNext();
        };
        audio.play();

        const line = document.createElement("div");
        line.textContent = item.text;
        log.appendChild(line);
        while (log.children.length > 20) {
          log.removeChild(log.firstChild);
        }
      }

      function connect() {
        const ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "speak") {
            queue.push(msg);
            playNext();
          }
        };
        ws.onclose = () => setTimeout(connect, 1000);
      }
      connect();
    </script>
  </body>
</html>
