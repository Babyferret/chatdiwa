<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>ChatDiWa</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #111214;
        color: #eee;
      }
      body.obs-mode {
        background: transparent;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        border-bottom: 1px solid #2a2a2e;
        flex-shrink: 0;
      }
      header button {
        background: #1c1d20;
        color: #eee;
        border: 1px solid #3a3a3f;
        border-radius: 6px;
        padding: 6px 16px;
        cursor: pointer;
        font-size: 14px;
      }
      header button.active {
        background: #f87068;
        border-color: #f87068;
      }
      #statusBadge {
        margin-left: auto;
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      #statusBadge .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #666;
        flex-shrink: 0;
      }
      #statusBadge.connected .dot {
        background: #4ade80;
      }
      #statusBadge.connecting .dot {
        background: #facc15;
      }
      #statusBadge.error .dot {
        background: #f87171;
      }
      .panel {
        flex: 1;
        overflow: hidden;
        display: none;
      }
      .panel.active {
        display: flex;
        flex-direction: column;
      }
      #chatLog {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
      }
      #chatLog .line {
        padding: 6px 0;
        border-bottom: 1px solid #222327;
        font-size: 14px;
        word-break: break-word;
      }
      #chatLog .line.silent {
        opacity: 0.55;
      }
      #chatLog .user {
        color: #f87068;
        font-weight: bold;
        margin-right: 6px;
      }
      #chatLog .empty {
        color: #666;
        padding: 20px 0;
        text-align: center;
      }
      #settingsForm {
        padding: 16px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 22px;
        max-width: 480px;
      }
      section.group {
        display: flex;
        flex-direction: column;
        gap: 14px;
        border-top: 1px solid #222327;
        padding-top: 16px;
      }
      section.group:first-child {
        border-top: none;
        padding-top: 0;
      }
      section.group > h2 {
        margin: 0;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #888;
      }
      label.field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
      }
      input[type="text"],
      input[type="number"],
      textarea {
        background: #1b1c1f;
        color: #eee;
        border: 1px solid #3a3a3f;
        border-radius: 6px;
        padding: 8px;
        font-size: 14px;
        font-family: inherit;
      }
      textarea {
        min-height: 60px;
        resize: vertical;
      }
      .radio-row {
        display: flex;
        gap: 16px;
        font-weight: normal;
        flex-wrap: wrap;
      }
      .radio-row label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .slider-row input[type="range"] {
        flex: 1;
      }
      .slider-row output {
        width: 46px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: #aaa;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .row input {
        flex: 1;
      }
      button {
        font-family: inherit;
      }
      button.primary {
        background: #f87068;
        border: none;
        color: white;
        padding: 9px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      button.secondary {
        background: #2a2b2f;
        border: 1px solid #3a3a3f;
        color: #eee;
        padding: 9px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      button.save {
        align-self: flex-start;
        background: #f87068;
        border: none;
        color: white;
        padding: 9px 22px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }
      #saveStatus {
        font-size: 13px;
        color: #4ade80;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #saveStatus.show {
        opacity: 1;
      }
      #overlayContainer {
        position: fixed;
        left: 24px;
        bottom: 24px;
        width: min(480px, calc(100vw - 48px));
        display: flex;
        flex-direction: column-reverse;
        gap: 8px;
        pointer-events: none;
      }
      #overlayContainer .bubble {
        font-size: 22px;
        font-weight: 600;
        line-height: 1.4;
        color: #fff;
        text-shadow:
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000,
          0 2px 6px rgba(0, 0, 0, 0.6);
        opacity: 1;
        transition: opacity 0.6s ease;
      }
      #overlayContainer .bubble.fade-out {
        opacity: 0;
      }
      #overlayContainer .bubble .user {
        color: #ffb3a7;
      }
    </style>
  </head>
  <body>
    <div id="overlayContainer"></div>
    <div class="app" id="app">
      <header>
        <button data-tab="chat" class="active">แชท</button>
        <button data-tab="settings">ตั้งค่า</button>
        <span id="statusBadge"><span class="dot"></span><span id="statusText">ยังไม่เชื่อมต่อ</span></span>
      </header>
      <div class="panel active" id="panel-chat">
        <div id="chatLog"><div class="empty">รอข้อความแชท...</div></div>
      </div>
      <div class="panel" id="panel-settings">
        <form id="settingsForm">
          <section class="group">
            <h2>การเชื่อมต่อ TikTok</h2>
            <label class="field">
              TikTok username (ไม่ต้องใส่ @)
              <div class="row">
                <input type="text" id="usernameInput" placeholder="เช่น mytiktokname" />
                <button type="button" class="primary" id="connectBtn">Connect</button>
                <button type="button" class="secondary" id="disconnectBtn">Disconnect</button>
              </div>
            </label>
          </section>

          <section class="group">
            <h2>เสียง</h2>
            <label class="field">
              เพศเสียง
              <div class="radio-row">
                <label><input type="radio" name="voiceKey" value="male" /> ชาย</label>
                <label><input type="radio" name="voiceKey" value="female" /> หญิง</label>
              </div>
            </label>
            <label class="field">
              ความเร็ว (rate)
              <div class="slider-row">
                <input type="range" name="rate" min="-50" max="50" step="1" />
                <output data-for="rate"></output>
              </div>
            </label>
            <label class="field">
              ระดับเสียงสูงต่ำ (pitch)
              <div class="slider-row">
                <input type="range" name="pitch" min="-50" max="50" step="1" />
                <output data-for="pitch"></output>
              </div>
            </label>
            <label class="field">
              ความดัง (volume)
              <div class="slider-row">
                <input type="range" name="volume" min="-50" max="50" step="1" />
                <output data-for="volume"></output>
              </div>
            </label>
          </section>

          <section class="group">
            <h2>รูปแบบข้อความ</h2>
            <div class="radio-row">
              <label
                ><input type="radio" name="template" value="name-and-message" />
                ชื่อ พูดว่า ข้อความ</label
              >
              <label
                ><input type="radio" name="template" value="message-only" />
                ข้อความอย่างเดียว</label
              >
            </div>
          </section>

          <section class="group">
            <h2>อ่านคอมเมนต์แบบไหน (Read Mode)</h2>
            <div class="radio-row">
              <label><input type="radio" name="readMode" value="all" /> อ่านทั้งหมด</label>
              <label
                ><input type="radio" name="readMode" value="prefix" />
                อ่านเฉพาะที่ขึ้นต้นด้วย...</label
              >
            </div>
            <label class="field" id="triggerPrefixesField">
              ตัวอักษรนำหน้า (บรรทัดละ 1 ตัว หรือคั่นด้วย ,) เช่น . หรือ /
              <textarea name="triggerPrefixes"></textarea>
            </label>
          </section>

          <section class="group">
            <h2>Overlay บนหน้าจอ (ใน OBS View)</h2>
            <label class="field" style="flex-direction: row; align-items: center; gap: 8px">
              <input type="checkbox" name="overlayEnabled" style="width: auto" />
              แสดง overlay ชื่อ+ข้อความบนหน้าจอ (เฉพาะคอมเมนต์ที่อ่านออกเสียงจริง)
            </label>
          </section>

          <section class="group">
            <h2>ตัวกรองอื่นๆ</h2>
            <label class="field">
              ความยาวข้อความสูงสุด (ตัวอักษร)
              <input type="number" name="maxMessageLength" min="1" />
            </label>
            <label class="field">
              จำนวนคิวสูงสุด
              <input type="number" name="maxQueueSize" min="1" />
            </label>
            <label class="field">
              บล็อก username (บรรทัดละ 1 ชื่อ หรือคั่นด้วย ,)
              <textarea name="blockedUsers"></textarea>
            </label>
            <label class="field">
              คำที่ไม่อ่านออกเสียง (บรรทัดละ 1 คำ หรือคั่นด้วย ,)
              <textarea name="bannedWords"></textarea>
            </label>
          </section>

          <div style="display: flex; align-items: center; gap: 12px">
            <button type="submit" class="save">บันทึก</button>
            <span id="saveStatus">บันทึกแล้ว</span>
          </div>

          <section class="group">
            <h2>เริ่มใหม่ตั้งแต่ต้น</h2>
            <button type="button" class="secondary" id="resetBtn" style="align-self: flex-start">
              รีเซ็ตการตั้งค่าทั้งหมด
            </button>
          </section>
        </form>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(location.search);
      const isObsMode = params.get("obs") === "1";
      document.body.classList.toggle("obs-mode", isObsMode);
      if (isObsMode) document.getElementById("app").style.display = "none";

      // --- tabs ---
      document.querySelectorAll("header button[data-tab]").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll("header button[data-tab]")
            .forEach((b) => b.classList.remove("active"));
          document
            .querySelectorAll(".panel")
            .forEach((p) => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
        });
      });

      // --- chat log ---
      const chatLog = document.getElementById("chatLog");
      function appendLine({ user, message, url }) {
        const empty = chatLog.querySelector(".empty");
        if (empty) empty.remove();

        const wasAtBottom =
          chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight < 30;

        const line = document.createElement("div");
        line.className = "line" + (url ? "" : " silent");
        const userSpan = document.createElement("span");
        userSpan.className = "user";
        userSpan.textContent = user || "";
        const textSpan = document.createElement("span");
        textSpan.textContent = message || "";
        line.appendChild(userSpan);
        line.appendChild(textSpan);
        chatLog.appendChild(line);

        while (chatLog.children.length > 200) {
          chatLog.removeChild(chatLog.firstChild);
        }
        if (wasAtBottom) chatLog.scrollTop = chatLog.scrollHeight;
      }

      function clearLog() {
        chatLog.innerHTML = '<div class="empty">รอข้อความแชท...</div>';
      }

      // --- overlay (OBS view only): fading name+message bubbles for every
      // comment that was actually read aloud, shares Read Mode's decision
      // rather than filtering separately ---
      const OVERLAY_FADE_AFTER_MS = 8000;
      const overlayContainer = document.getElementById("overlayContainer");
      let overlayEnabled = true;

      function addOverlayBubble({ user, message }) {
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        const userSpan = document.createElement("span");
        userSpan.className = "user";
        userSpan.textContent = (user || "") + ": ";
        const textSpan = document.createElement("span");
        textSpan.textContent = message || "";
        bubble.appendChild(userSpan);
        bubble.appendChild(textSpan);
        overlayContainer.appendChild(bubble);

        setTimeout(() => bubble.classList.add("fade-out"), OVERLAY_FADE_AFTER_MS);
        bubble.addEventListener("transitionend", () => bubble.remove());
      }

      // --- status badge ---
      const statusBadge = document.getElementById("statusBadge");
      const statusText = document.getElementById("statusText");
      const STATUS_LABELS = {
        idle: "ยังไม่เชื่อมต่อ",
        connecting: "กำลังเชื่อมต่อ...",
        connected: "เชื่อมต่อแล้ว",
        error: "เชื่อมต่อไม่สำเร็จ",
      };
      function applyStatus({ status, username, error }) {
        statusBadge.className = status;
        if (status === "connected") {
          statusText.textContent = `${STATUS_LABELS.connected} (@${username})`;
        } else if (status === "error") {
          statusText.textContent = `${STATUS_LABELS.error}: ${error || ""}`;
        } else {
          statusText.textContent = STATUS_LABELS[status] || status;
        }
      }

      // --- audio playback (OBS view only, to avoid double playback
      // when the streamer also has this page open in a normal tab) ---
      const queue = [];
      let playing = false;
      let unlockButton = null;

      function showUnlockButton() {
        if (unlockButton) return;
        unlockButton = document.createElement("button");
        unlockButton.textContent = "คลิกเพื่อเปิดเสียง (ทดสอบนอก OBS)";
        Object.assign(unlockButton.style, {
          position: "fixed",
          top: "50%",
          left: "50%",
          transform: "translate(-50%, -50%)",
          padding: "12px 20px",
          fontSize: "14px",
          cursor: "pointer",
        });
        unlockButton.addEventListener("click", () => {
          unlockButton.remove();
          unlockButton = null;
          playing = false;
          playNext();
        });
        document.body.appendChild(unlockButton);
      }

      function playNext() {
        if (playing || queue.length === 0) return;
        playing = true;
        const url = queue.shift();
        const audio = new Audio(url);
        audio.onended = () => {
          playing = false;
          playNext();
        };
        audio.onerror = () => {
          playing = false;
          playNext();
        };
        audio.play().catch((err) => {
          // Regular browser tabs block autoplay without a prior click;
          // OBS/vMix/etc. (CEF-based) disable that policy, so this only
          // happens when testing ?obs=1 directly in a normal browser.
          console.warn("Playback blocked:", err.message);
          playing = false;
          queue.unshift(url);
          showUnlockButton();
        });
      }

      function connectWs() {
        const ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          if (msg.type === "comment") {
            appendLine(msg);
            if (isObsMode && msg.url) {
              queue.push(msg.url);
              playNext();
              if (overlayEnabled) addOverlayBubble(msg);
            }
          } else if (msg.type === "status") {
            applyStatus(msg);
          } else if (msg.type === "clear") {
            clearLog();
          } else if (msg.type === "config") {
            overlayEnabled = msg.config.overlayEnabled;
          }
        };
        ws.onclose = () => setTimeout(connectWs, 1000);
      }
      connectWs();

      // both views need to know overlayEnabled at load: the control panel to
      // show the checkbox's saved state, the OBS view to decide whether to
      // render bubbles at all before the first "config" broadcast arrives.
      fetch("/api/config")
        .then((res) => res.json())
        .then((config) => {
          overlayEnabled = config.overlayEnabled;
        });

      // --- settings form + connection controls (not shown in OBS mode) ---
      if (!isObsMode) {
        const form = document.getElementById("settingsForm");
        const saveStatus = document.getElementById("saveStatus");
        const usernameInput = document.getElementById("usernameInput");
        const triggerPrefixesField = document.getElementById("triggerPrefixesField");

        function voiceToKey(voice) {
          return voice && voice.includes("Premwadee") ? "female" : "male";
        }

        function updateTriggerFieldVisibility() {
          const mode = form.querySelector('input[name="readMode"]:checked')?.value;
          triggerPrefixesField.style.display = mode === "prefix" ? "flex" : "none";
        }
        form.querySelectorAll('input[name="readMode"]').forEach((el) => {
          el.addEventListener("change", updateTriggerFieldVisibility);
        });

        for (const name of ["rate", "pitch", "volume"]) {
          const slider = form.elements[name];
          const output = form.querySelector(`output[data-for="${name}"]`);
          slider.addEventListener("input", () => {
            const value = Number(slider.value);
            output.textContent = (value >= 0 ? "+" : "") + value + "%";
          });
        }

        async function loadSettings() {
          const res = await fetch("/api/config");
          const config = await res.json();
          usernameInput.value = config.tiktokUsername || "";
          form.voiceKey.value = voiceToKey(config.voice);
          form.template.value = config.template;
          form.readMode.value = config.readMode;
          form.triggerPrefixes.value = (config.triggerPrefixes || []).join("\n");
          form.maxMessageLength.value = config.maxMessageLength;
          form.maxQueueSize.value = config.maxQueueSize;
          form.blockedUsers.value = (config.blockedUsers || []).join("\n");
          form.bannedWords.value = (config.bannedWords || []).join("\n");
          form.overlayEnabled.checked = config.overlayEnabled;
          for (const name of ["rate", "pitch", "volume"]) {
            form.elements[name].value = config[name];
            form.elements[name].dispatchEvent(new Event("input"));
          }
          updateTriggerFieldVisibility();
        }
        loadSettings();

        async function loadStatus() {
          const res = await fetch("/api/status");
          applyStatus(await res.json());
        }
        loadStatus();

        document.getElementById("connectBtn").addEventListener("click", async () => {
          await fetch("/api/connect", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: usernameInput.value }),
          });
        });

        document.getElementById("disconnectBtn").addEventListener("click", async () => {
          await fetch("/api/disconnect", { method: "POST" });
        });

        document.getElementById("resetBtn").addEventListener("click", async () => {
          await fetch("/api/reset", { method: "POST" });
          location.reload();
        });

        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          const data = new FormData(form);
          const payload = {
            voiceKey: data.get("voiceKey"),
            template: data.get("template"),
            readMode: data.get("readMode"),
            triggerPrefixes: data.get("triggerPrefixes"),
            maxMessageLength: Number(data.get("maxMessageLength")),
            maxQueueSize: Number(data.get("maxQueueSize")),
            blockedUsers: data.get("blockedUsers"),
            bannedWords: data.get("bannedWords"),
            rate: Number(data.get("rate")),
            pitch: Number(data.get("pitch")),
            volume: Number(data.get("volume")),
            overlayEnabled: form.overlayEnabled.checked,
          };
          // server expects a resolved voice string, not the radio key
          payload.voice =
            payload.voiceKey === "female"
              ? "th-TH-PremwadeeNeural"
              : "th-TH-NiwatNeural";

          await fetch("/api/config", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          saveStatus.classList.add("show");
          setTimeout(() => saveStatus.classList.remove("show"), 1500);
        });
      }
    </script>
  </body>
</html>
